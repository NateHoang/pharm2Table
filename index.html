<!doctype html>
<html>
  <head>
    <title>Pharm 2 Table</title>
    <meta http-equiv="Content-type" content="text/html;charset=UTF-8" />

    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", "Ubuntu",
          "Droid Sans", sans-serif, "Meiryo";
        padding: 0 12px;
      }

      table {
        border-collapse: collapse;
        margin-bottom: 24px;
        width: 100%;
      }
      table > thead > tr > th,
      table > tbody > tr > td {
        padding: 5px 10px;
      }
      table > thead > tr > th {
        text-align: left;
        border-bottom: 1px solid;
      }
      table > tbody > tr + tr > td {
        border-top: 1px solid;
      }

      .tooltip {
        position: relative;
        cursor: pointer;
        display: inline-block;
      }
      .tooltip img {
        display: none;
        position: absolute;
        width: var(--tooltip-img-width, 300px);
        height: auto;
        border: 2px solid #f00;
        background: #ffffcc;
        padding: 5px;
        z-index: 10;
        bottom: 100%;
        left: 50%;
        transform: translateX(10px);
        max-width: 90vw; /* ✅ prevents image from exceeding viewport width */
        max-height: 80vh; /* ✅ keeps image inside visible page vertically */
        object-fit: contain;
        box-sizing: border-box;
      }

      .tooltip[data-position="below"] img {
        bottom: auto;
        top: 100%;
      }

      .tooltip:hover img {
        display: block;
        /* Reposition if too close to top or bottom of viewport */
        top: auto;
        bottom: auto;
      }

      .blurred {
        filter: blur(3px);
        transition: filter 0.3s ease;
      }

      table td:not(:first-child),
      table td li {
        cursor: pointer;
      }

      summary {
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        margin: 16px 0;
      }

      details {
        border: 2px solid #444;
        border-radius: 8px;
        padding: 10px;
        background: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <h2>Protected Content</h2>
    <p>Please enter the password to view the content:</p>
    <input type="password" id="password" placeholder="Enter password" />
    <button onclick="checkPassword()">Submit</button>
    <div id="content" style="display: none; margin-top: 20px">
      <!-- <div> -->
      <div class="blur-buttons">
        <button id="blurAll">Blur All (Press spacebar to blur)</button>
        <button id="unblurAll">Unblur All (Press spacebar to unblue)</button>
        <button
          id="shuffleAllTables"
          title="Shuffle each table's rows within its own details block"
        >
          Shuffle Tables (Press z to shuffle)
        </button>
        <button
          id="resetTables"
          title="Reset all tables to their original order"
        >
          Reset Tables (Press X to unshuffle)
        </button>
        <button id="toggleDetails">Expand/Collapse All (Press E)</button>
        <button
          id="darkModeToggle"
          style="
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 9999;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
          "
        >
          Dark mode
        </button>
      </div>
      <br />
    </div>
    <style>
      /* same as before */
      .blurred {
        filter: blur(10px);
        transition: filter 0.3s ease;
      }

      /* Make clickable cursor for td */
      table td:not(:first-child) {
        cursor: pointer;
      }

      /* li inside blurred td will inherit blur from parent */
      table td.blurred li {
        filter: inherit;
      }

      .blur-buttons {
        text-align: center;
        margin-bottom: 16px;
      }
      .blur-buttons button {
        margin: 0 5px;
        padding: 5px 12px;
        font-size: 16px;
        cursor: pointer;
      }
      .blur-section li {
        cursor: pointer;
        margin-bottom: 6px;
      }

      /* Blur effect same as td */
      .blur-section li.blurred {
        filter: blur(10px);
        transition: filter 0.3s ease;
      }

      /* Override for bold text so it always stays clear */
      .blur-section li.blurred b {
        filter: none !important;
      }

      .blur-section .blur-target {
        cursor: pointer;
        display: inline-block;
      }

      .blurred {
        filter: blur(10px);
        transition: filter 0.3s ease;
      }

      body.dark {
        background: #0f1115;
        color: #e8eaf0;
      }
      body.dark table > thead > tr > th,
      body.dark table > tbody > tr > td {
        color: #e8eaf0;
      }
      body.dark table > thead > tr > th {
        border-bottom: 1px solid #3a3f4a;
      }
      body.dark table > tbody > tr + tr > td {
        border-top: 1px solid #3a3f4a;
      }
      body.dark details {
        background: #151922;
        border-color: #5a616f;
      }
      body.dark .blur-buttons button {
        background: #1b2230;
        border: 1px solid #3a4252;
        color: #e8eaf0;
      }
      body.dark input {
        background: #151922;
        color: #e8eaf0;
        border-color: #3a4252;
      }
      body.dark button {
        background: #1b2230;
        border: 1px solid #3a4252;
        color: #e8eaf0;
      }
    </style>
    <script>
      // === BLUR LOGIC (delegated for reliability after resets) ===
      document.addEventListener("DOMContentLoaded", () => {
        // Delegated click: blur targets
        document.addEventListener("click", (e) => {
          const target = e.target;
          // Blur targets: any table td except first-child, or elements with class 'blur-target'
          const blurTarget =
            target.closest("td:not(:first-child)") ||
            target.closest(".blur-target");
          if (blurTarget) {
            blurTarget.classList.toggle("blurred");
          }
        });

        // Space toggles all blurables
        document.addEventListener("keydown", (event) => {
          if (event.code === "Space") {
            const blurCells = document.querySelectorAll(
              "table td:not(:first-child), .blur-section .blur-target",
            );
            const allBlurred = Array.from(blurCells).every((cell) =>
              cell.classList.contains("blurred"),
            );
            blurCells.forEach((cell) => {
              if (allBlurred) cell.classList.remove("blurred");
              else cell.classList.add("blurred");
            });
            event.preventDefault();
          }
        });

        // Buttons (if present)
        const blurAllBtn = document.getElementById("blurAll");
        const unblurAllBtn = document.getElementById("unblurAll");
        if (blurAllBtn) {
          blurAllBtn.addEventListener("click", () => {
            document
              .querySelectorAll(
                "table td:not(:first-child), .blur-section .blur-target",
              )
              .forEach((el) => el.classList.add("blurred"));
          });
        }
        if (unblurAllBtn) {
          unblurAllBtn.addEventListener("click", () => {
            document
              .querySelectorAll(
                "table td:not(:first-child), .blur-section .blur-target",
              )
              .forEach((el) => el.classList.remove("blurred"));
          });
        }
      });

      // === CUSTOM HEADER ELEMENT (unchanged) ===
      class MyHeader extends HTMLElement {
        connectedCallback() {
          const text = this.innerHTML.trim() || "Section Title";

          this.innerHTML = `
        <div
          style="
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            --tooltip-img-width: 400px;
          "
        >
          ${text}
        </div>
        <br />
      `;
        }
      }
      customElements.define("my-header", MyHeader);

      // === PASSWORD CHECK (unchanged) ===
      function checkPassword() {
        const enteredPassword = document.getElementById("password").value;
        const correctPassword = "";
        if (enteredPassword === correctPassword) {
          document.getElementById("content").style.display = "block";
          document.querySelector("h2").style.display = "none";
          document.querySelector("p").style.display = "none";
          document.getElementById("password").style.display = "none";
          event.target.style.display = "none";
        } else {
          alert("Incorrect password. Please try again.");
        }
      }

      // === SHUFFLE LOGIC (per-table inside details blocks) ===
      function shuffleRowsInTable(table) {
        const tbody = table.querySelector("tbody");
        if (!tbody) return;

        const rows = Array.from(tbody.querySelectorAll("tr"));
        if (rows.length <= 1) return;

        // Detach all rows
        rows.forEach((row) => tbody.removeChild(row));

        // Fisher-Yates shuffle
        for (let i = rows.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [rows[i], rows[j]] = [rows[j], rows[i]];
        }

        // Re-attach in new order
        for (const row of rows) tbody.appendChild(row);
      }

      /* Capture the original order of rows for all tables inside details blocks (on page load) */
      function captureOriginalOrder() {
        const data = new Map();
        document.querySelectorAll("details table").forEach((tbl) => {
          const tbody = tbl.querySelector("tbody");
          if (!tbody) return;
          const order = Array.from(tbody.querySelectorAll("tr")).map((tr) =>
            tr.cloneNode(true),
          );
          data.set(tbl, order);
        });
        return data;
      }

      /* Restore original order for all tables inside details blocks */
      function resetTablesToOriginal(orderMap) {
        orderMap.forEach((originalRows, tbl) => {
          const tbody = tbl.querySelector("tbody");
          if (!tbody) return;
          // Remove current rows
          const current = Array.from(tbody.querySelectorAll("tr"));
          current.forEach((row) => tbody.removeChild(row));

          // Append copies in original order
          originalRows.forEach((row) => tbody.appendChild(row.cloneNode(true)));
        });
      }

      /* Shuffle every table inside every details block independently */
      function shuffleAllTablesInDetails() {
        const detailsBlocks = document.querySelectorAll("details");
        detailsBlocks.forEach((det) => {
          det.querySelectorAll("table").forEach((tbl) => {
            shuffleRowsInTable(tbl);
          });
        });
      }

      /* Wire up UI and keyboard shortcuts (Z to shuffle, X to reset) */
      document.addEventListener("DOMContentLoaded", () => {
        // Prepare original order snapshot
        const originalOrder = captureOriginalOrder();

        // Button handlers
        const btnShuffle = document.getElementById("shuffleAllTables");
        if (btnShuffle) {
          btnShuffle.addEventListener("click", () => {
            shuffleAllTablesInDetails();
          });
        }

        const btnReset = document.getElementById("resetTables");
        if (btnReset) {
          btnReset.addEventListener("click", () => {
            resetTablesToOriginal(originalOrder);
          });
        }

        const btnToggleDetails = document.getElementById("toggleDetails");

        if (btnToggleDetails) {
          btnToggleDetails.addEventListener("click", () => {
            const detailsBlocks = Array.from(
              document.querySelectorAll("details"),
            );
            const allOpen = detailsBlocks.every((details) => details.open);

            detailsBlocks.forEach((details) => {
              details.open = !allOpen;
            });
          });
        }

        // Keyboard shortcuts
        document.addEventListener("keydown", (event) => {
          const key = event.key.toLowerCase();
          if (key === "z") {
            shuffleAllTablesInDetails();
            event.preventDefault();
          } else if (key === "x") {
            resetTablesToOriginal(originalOrder);
            event.preventDefault();
          } else if (key === "e") {
            const detailsBlocks = Array.from(
              document.querySelectorAll("details"),
            );
            const allOpen = detailsBlocks.every((details) => details.open);

            detailsBlocks.forEach((details) => {
              details.open = !allOpen;
            });

            event.preventDefault();
          }
        });
      });
      (function () {
        const toggle = document.getElementById("darkModeToggle");
        if (!toggle) return;

        // Load saved preference
        const saved = localStorage.getItem("darkMode");
        if (saved === "true") document.body.classList.add("dark");

        function updateLabel() {
          toggle.textContent = document.body.classList.contains("dark")
            ? "Light mode"
            : "Dark mode";
        }
        updateLabel();

        toggle.addEventListener("click", () => {
          document.body.classList.toggle("dark");
          const isDark = document.body.classList.contains("dark");
          localStorage.setItem("darkMode", String(isDark));
          updateLabel();
        });
      })();
    </script>
  </body>
</html>
